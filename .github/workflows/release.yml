name: Release

# Builds de test installables, publiés sur la pré-release « dev-latest »
# (page Releases du dépôt) à chaque push sur dev :
#   - card-manager-linux-x86_64          (exécutable seul : Arch, CachyOS, toute
#                                         distrib avec webkit2gtk-4.1 installé)
#   - card-manager-linux-amd64.deb        (Debian, Ubuntu, Mint, Pop!_OS…)
#   - card-manager-linux-x86_64.rpm       (Fedora, openSUSE…)
#   - card-manager-linux-x86_64.AppImage  (le reste ; embarque ses bibliothèques,
#                                         ce qui casse sur certains systèmes
#                                         récents : EGL_BAD_PARAMETER sur CachyOS)
#   - card-manager-android-arm64.apk      (téléphones Android 64 bits)
# L'exécutable, le .deb et le .rpm utilisent les bibliothèques du système
# (WebKitGTK, pilotes graphiques) : c'est ce qui marche partout.
# Sur une PR qui touche ce workflow : build seul, sans publication.
on:
  push:
    branches: [dev]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # version croissante → l'APK et l'AppImage se mettent à jour par-dessus
  APP_VERSION: 0.1.${{ github.run_number }}

jobs:
  linux:
    runs-on: ubuntu-22.04 # glibc ancienne = AppImage compatible avec les distribs récentes
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file \
            libxdo-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-linux

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            app/pnpm-lock.yaml

      - name: Install JS deps
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          cd app && pnpm install --ignore-workspace --frozen-lockfile

      - name: Build frontend
        working-directory: app
        run: pnpm --ignore-workspace generate
        # synchro Google Drive : identifiants du client OAuth « bureau »
        # (Google ne considère pas ce secret comme confidentiel pour une appli
        # installée ; il reste hors du dépôt). Android n'en a pas besoin :
        # l'appli y est reconnue par son paquet et sa clé de signature.
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Build Linux packages
        run: pnpm tauri build --bundles appimage,deb,rpm --config "{\"version\":\"$APP_VERSION\"}"

      - name: Collect
        run: |
          mkdir out
          cp src-tauri/target/release/card-manager out/card-manager-linux-x86_64
          cp src-tauri/target/release/bundle/deb/*.deb out/card-manager-linux-amd64.deb
          cp src-tauri/target/release/bundle/rpm/*.rpm out/card-manager-linux-x86_64.rpm
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/card-manager-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/
          retention-days: 7

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # SDK + NDK sont préinstallés sur les runners ubuntu (ANDROID_HOME,
      # ANDROID_NDK_LATEST_HOME) ; Tauri attend NDK_HOME.
      - name: Android NDK
        run: |
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-android

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            app/pnpm-lock.yaml

      - name: Install JS deps
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          cd app && pnpm install --ignore-workspace --frozen-lockfile

      - name: Build frontend
        working-directory: app
        run: pnpm --ignore-workspace generate
        # synchro Google Drive : identifiants du client OAuth « bureau »
        # (Google ne considère pas ce secret comme confidentiel pour une appli
        # installée ; il reste hors du dépôt). Android n'en a pas besoin :
        # l'appli y est reconnue par son paquet et sa clé de signature.
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      # src-tauri/gen/ n'est pas versionné : on génère le projet Android ici,
      # puis les icônes de l'app dans ses ressources.
      - name: Init Android project
        run: |
          pnpm tauri android init --ci
          pnpm tauri icon src-tauri/icons/icon.png

      - name: Build APK (arm64)
        run: pnpm tauri android build --apk --target aarch64 --ci --config "{\"version\":\"$APP_VERSION\"}"

      # Signature : la clé vit dans les secrets du dépôt (jamais dans git, le
      # dépôt est public). Générer la clé et les secrets : scripts/android-keystore.sh.
      # Sans secret (ex. PR de fork) : clé jetable, l'APK s'installe mais ne
      # pourra pas se mettre à jour par-dessus un APK signé autrement.
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)
          echo "APK non signé : $apk"
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$ks"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 absent : APK signé avec une clé jetable (pas de mise à jour par-dessus un APK précédent)."
            KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            KEY_ALIAS=ephemeral
            keytool -genkeypair -storetype PKCS12 -keystore "$ks" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 30 -storepass "$KEYSTORE_PASSWORD" \
              -dname "CN=card-manager ephemeral" > /dev/null
          fi
          export KEYSTORE_PASSWORD
          mkdir out
          "$bt/zipalign" -p -f 4 "$apk" aligned.apk
          "$bt/apksigner" sign --ks "$ks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --out out/card-manager-android-arm64.apk aligned.apk
          "$bt/apksigner" verify out/card-manager-android-arm64.apk
          rm -f "$ks"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request'
    needs: [linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish dev-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev-latest --cleanup-tag --yes || true
          gh release create dev-latest dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Build de test $APP_VERSION" \
            --notes "Build automatique de \`${GITHUB_SHA::7}\` (branche ${GITHUB_REF_NAME}).

          **PC (Linux)**, au choix selon la distribution :
          - Arch, CachyOS, Manjaro… : \`card-manager-linux-x86_64\` (nécessite le paquet \`webkit2gtk-4.1\`), puis \`chmod +x card-manager-linux-x86_64\` et le lancer.
          - Debian, Ubuntu, Mint… : \`card-manager-linux-amd64.deb\` (\`sudo apt install ./card-manager-linux-amd64.deb\`).
          - Fedora, openSUSE… : \`card-manager-linux-x86_64.rpm\` (\`sudo dnf install ./card-manager-linux-x86_64.rpm\`).
          - Sinon : l'AppImage (\`chmod +x\` puis la lancer).
          **Android** : télécharger l'APK depuis le téléphone et l'installer (autoriser les sources inconnues)."

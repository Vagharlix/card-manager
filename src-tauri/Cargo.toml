[package]
name = "card-manager"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "card_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "blocking"] }
# décompression des fichiers de données en masse (Magic : JSONL gzip)
flate2 = "1"
tauri-plugin-dialog = "~2.6"
tauri-plugin-fs = "~2.5"

# scan de QR codes (partage de collection) : caméra, mobile uniquement
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "~2.4"

# reconnaissance de texte ML Kit (scan de cartes) : plugin local, Android uniquement
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-card-scanner = { path = "plugins/card-scanner" }
# marges système (bord à bord Android 15+) : plugin local
tauri-plugin-safe-area = { path = "plugins/safe-area" }
# connexion Google native (synchro Drive) : plugin local
tauri-plugin-google-auth = { path = "plugins/google-auth" }

